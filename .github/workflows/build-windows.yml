# Builds the portable EXE and the installer on GitHub's Windows runners.
# Push to GitHub, open the "Actions" tab, and download the "TIS-Windows" artifact.
# Pushing a tag like v1.0.0 also attaches the files to a GitHub Release.
name: Build Windows

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Run tests (including headless GUI tests)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build (tests, PyInstaller, Inno Setup)
        shell: cmd
        run: packaging\build_windows.bat
      - name: Self-test the built executables (headless)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          foreach ($exe in @("dist\TIS_Bangla_Word_Converter\TIS_Bangla_Word_Converter.exe", "dist\TIS_Bangla_Word_Converter.exe")) {
            $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -PassThru -Wait
            if ($p.ExitCode -ne 0) { Write-Error "$exe self-test failed with code $($p.ExitCode)"; exit 1 }
            Write-Host "$exe self-test OK"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: TIS-Windows
          path: |
            release/TIS_Bangla_Word_Converter_Setup.exe
            release/TIS_Bangla_Word_Converter_Portable.zip
            release/TIS_Bangla_Word_Converter.exe
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/TIS_Bangla_Word_Converter_Setup.exe
            release/TIS_Bangla_Word_Converter_Portable.zip
